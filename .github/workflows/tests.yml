name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Builder, UI and real-Tk checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tk, Xvfb and Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk python3-venv xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r tests/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run all checks
        run: PYTHON=.venv/bin/python bash tests/run_all.sh
